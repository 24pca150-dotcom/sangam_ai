<nav class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 fixed w-full top-0 z-50 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo & Title -->
      <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2.5 group shrink-0">
        <img src="sangam-logo.png" alt="Tamil Logo" class="w-7 h-7 sm:w-8 sm:h-8 object-contain drop-shadow-md transition-transform group-hover:scale-105">
        <span class="text-base sm:text-xl font-bold bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 bg-clip-text text-transparent pb-0.5 inline-block tracking-tight">அறிக புறநானூறு</span>
      </a>

      <!-- Desktop Nav Items -->
      <div class="hidden md:flex space-x-2 items-center">
        <a routerLink="/" 
           [routerLinkActiveOptions]="{exact: true}"
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
           class="text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-sm font-medium border border-transparent transition-all hover:bg-slate-700/50">
           Dashboard
        </a>

        <a routerLink="/search" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
           class="text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-sm font-medium border border-transparent transition-all hover:bg-slate-700/50">
           Search
        </a>

        <a routerLink="/chat"
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
           class="text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-sm font-medium border border-transparent transition-all hover:bg-slate-700/50 flex items-center gap-2">
          <svg class="w-4 h-4 shrink-0 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
            </path>
          </svg>
          <span>AI Chat</span>
        </a>

        <a routerLink="/admin" 
           routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
           class="text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-sm font-medium border border-transparent transition-all hover:bg-slate-700/50">
           Admin
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden items-center">
        <button (click)="toggleMobileMenu()" type="button" 
                class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700/60 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition-all">
          <svg *ngIf="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg *ngIf="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="mobileMenuOpen" class="md:hidden border-t border-slate-700/60 bg-slate-900/95 backdrop-blur-xl px-4 pt-3 pb-4 space-y-2 shadow-2xl animate-fade-in">
    <a routerLink="/" 
       [routerLinkActiveOptions]="{exact: true}"
       routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
       (click)="closeMobileMenu()"
       class="block text-slate-300 hover:text-white px-4 py-3 rounded-xl text-base font-medium border border-transparent transition-all hover:bg-slate-800">
       Dashboard
    </a>

    <a routerLink="/search" 
       routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
       (click)="closeMobileMenu()"
       class="block text-slate-300 hover:text-white px-4 py-3 rounded-xl text-base font-medium border border-transparent transition-all hover:bg-slate-800">
       Search
    </a>

    <a routerLink="/chat"
       routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
       (click)="closeMobileMenu()"
       class="flex items-center gap-2.5 text-slate-300 hover:text-white px-4 py-3 rounded-xl text-base font-medium border border-transparent transition-all hover:bg-slate-800">
      <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
        </path>
      </svg>
      <span>AI Chat</span>
    </a>

    <a routerLink="/admin" 
       routerLinkActive="bg-amber-500/10 text-amber-400 border-amber-500/30 font-bold"
       (click)="closeMobileMenu()"
       class="block text-slate-300 hover:text-white px-4 py-3 rounded-xl text-base font-medium border border-transparent transition-all hover:bg-slate-800">
       Admin
    </a>
  </div>
</nav>

<main [ngClass]="{'fixed top-16 inset-x-0 bottom-0 p-0 max-w-none w-full overflow-hidden flex flex-col bg-slate-900': isChatPage, 'pt-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto pb-12': !isChatPage}">
  <router-outlet></router-outlet>
</main>
