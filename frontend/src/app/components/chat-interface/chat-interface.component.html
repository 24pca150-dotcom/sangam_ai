<div [ngClass]="{'h-full w-full': isEmbedded, 'w-full h-full bg-slate-900 overflow-hidden': !isEmbedded}" class="flex flex-1 relative h-full">

  <!-- Mobile Backdrop Overlay when Sidebar is open -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="md:hidden fixed inset-0 bg-black/70 z-40 backdrop-blur-xs"></div>

  <!-- LEFT SIDEBAR (ChatGPT Style, Responsive Drawer) -->
  <aside [ngClass]="{
           'translate-x-0 opacity-100': isSidebarOpen, 
           '-translate-x-full opacity-0 pointer-events-none md:opacity-100 md:pointer-events-auto md:translate-x-0': !isSidebarOpen,
           'md:w-64 lg:w-72': isSidebarOpen,
           'md:w-0 md:overflow-hidden md:border-0': !isSidebarOpen
         }" 
         class="fixed md:relative inset-y-0 left-0 z-50 w-72 max-w-[80vw] h-full transition-all duration-300 flex flex-col bg-slate-950 border-r border-slate-800 shrink-0 shadow-2xl md:shadow-none">




    
    <!-- Sidebar Top Header -->
    <div class="p-3.5 sm:p-4 border-b border-slate-800/80 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-slate-950 font-bold text-sm shrink-0 shadow-md">
          அ
        </div>
        <span class="font-bold text-slate-200 text-sm truncate tracking-wide">அறிக புறநானூறு</span>
      </div>
      
      <!-- Close / Toggle Sidebar Button (Single Button when Sidebar is open) -->
      <button (click)="toggleSidebar()" title="Collapse sidebar" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/80 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
        </svg>
      </button>
    </div>

    <!-- New Chat Button -->
    <div class="p-3 sm:p-4 pb-2">
      <button (click)="newChat()" class="w-full bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700/80 hover:border-amber-500/50 text-slate-100 font-semibold px-3.5 py-2.5 rounded-xl transition-all flex items-center justify-between shadow-sm group">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-amber-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span class="text-sm">New Chat</span>
        </div>
        <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
      </button>
    </div>

    <!-- Search Recents -->
    <div class="px-3 sm:px-4 py-1.5">
      <div class="relative">
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search history..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 pl-8 text-xs text-slate-200 focus:outline-none focus:border-amber-500/50 transition-colors">
        <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>

    <!-- History / Recents Section -->
    <div class="flex-1 overflow-y-auto px-3 sm:px-4 py-2 space-y-1 no-scrollbar">
      <div class="flex items-center justify-between px-2 py-1">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Recents</p>
        <button *ngIf="sessions.length > 0" (click)="clearAllSessions()" title="Clear all history" class="text-[10px] text-slate-500 hover:text-red-400 transition-colors font-medium cursor-pointer">
          Clear all
        </button>
      </div>
      
      <div *ngFor="let s of filteredSessions" 
           (click)="selectSession(s.id)" 
           [ngClass]="{'bg-slate-800/90 text-amber-400 font-semibold border border-slate-700/60 shadow-sm': s.id === activeSessionId, 'text-slate-300 hover:bg-slate-800/40 hover:text-white': s.id !== activeSessionId}"
           class="group flex items-center justify-between px-3 py-2 rounded-xl text-xs cursor-pointer transition-all">
        <div class="flex items-center gap-2.5 truncate">
          <svg class="w-4 h-4 shrink-0" [ngClass]="{'text-amber-400': s.id === activeSessionId, 'text-slate-500 group-hover:text-slate-300': s.id !== activeSessionId}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
          </svg>
          <span class="truncate">{{ s.title }}</span>
        </div>
        
        <!-- Delete session icon (always visible on mobile touch, hover on desktop) -->
        <button (click)="deleteSession(s.id, $event)" title="Delete session" class="opacity-80 sm:opacity-0 group-hover:opacity-100 hover:text-red-400 text-slate-400 p-1 rounded transition-opacity shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </button>
      </div>

      <div *ngIf="filteredSessions.length === 0" class="text-center py-6 text-xs text-slate-500">
        No chats found
      </div>
    </div>

  </aside>

  <!-- RIGHT MAIN CHAT SCREEN (Full Screen Uniform bg-slate-900) -->
  <main class="flex-1 flex flex-col h-full bg-slate-900 relative overflow-hidden min-w-0">
    
    <!-- Top Header Bar (Single Toggle Button: Only shown when Sidebar is collapsed) -->
    <header class="bg-slate-900 border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between gap-3 shrink-0">
      <div class="flex items-center gap-3">
        <!-- Sidebar Toggle Button (Only shown when sidebar is closed) -->
        <button *ngIf="!isSidebarOpen" (click)="toggleSidebar()" title="Open sidebar" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 hover:text-amber-300 border border-slate-700 transition-colors shrink-0 flex items-center gap-1.5 shadow-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <span class="text-xs font-bold uppercase tracking-wider">Chats</span>
        </button>

      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button (click)="newChat()" class="sm:hidden p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>
        <span class="text-[11px] px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 font-semibold border border-amber-500/20">
          RAG AI v1.0
        </span>
      </div>
    </header>

    <!-- Main Message Scroll Container (Full Width max-w-none px-4 sm:px-8 lg:px-12) -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 no-scrollbar" #chatContainer>
      <div class="w-full max-w-none px-2 sm:px-6 md:px-12 space-y-6 transition-all duration-300">
        
        <div *ngFor="let msg of messages; let last = last" class="flex flex-col" 
             [ngClass]="{'items-end': msg.role === 'user', 'items-start': msg.role === 'assistant'}">
          
          <!-- Message Bubble Container -->
          <div class="max-w-[95%] sm:max-w-[90%] md:max-w-[85%]" 
               [ngClass]="{
                 'bg-gradient-to-br from-amber-500 to-orange-500 text-slate-950 rounded-2xl rounded-tr-xs shadow-md': msg.role === 'user', 
                 'bg-slate-800/90 text-slate-200 rounded-2xl rounded-tl-xs border border-slate-700/80 shadow-sm': msg.role === 'assistant'
               }">
            
            <div class="p-4 sm:p-5 whitespace-pre-line leading-relaxed font-medium text-sm sm:text-base">
              {{ msg.content }}
            </div>
            


            <!-- Retrieved Context Sources -->
            <div *ngIf="msg.sources && msg.sources.length > 0" class="px-4 pb-4 pt-2 border-t border-slate-700/60 mt-2">
              <p class="text-xs text-amber-400 font-bold mb-2 uppercase tracking-wider">Retrieved Context</p>
              <div class="space-y-1.5">
                <div *ngFor="let source of msg.sources" class="bg-slate-900 rounded-lg p-2 text-xs text-slate-300 line-clamp-2 border border-slate-800" [title]="source">
                  {{ source }}
                </div>
              </div>
            </div>
          </div>

          <!-- Suggested Questions UI: Sleek Pill Chips / Tags -->
          <div *ngIf="msg.role === 'assistant' && msg.suggested_questions && msg.suggested_questions.length > 0" 
               class="mt-3.5 space-y-2 w-full">
            <div class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold tracking-wide px-1">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
              </svg>
              <span>தொடர்புடைய கேள்விகள்:</span>
            </div>

            <div class="flex flex-wrap gap-2 pt-0.5">
              <button *ngFor="let suggestion of msg.suggested_questions; let i = index" 
                      (click)="sendQuestion(suggestion, msg.suggested_question_ids ? msg.suggested_question_ids[i] : undefined)" 
                      [disabled]="loading"
                      class="group inline-flex items-center gap-2 bg-slate-800 hover:bg-amber-500/15 border border-slate-700/80 hover:border-amber-500/40 text-slate-200 hover:text-amber-300 px-3.5 py-2 rounded-full text-xs sm:text-sm font-medium transition-all shadow-sm hover:shadow-amber-500/10 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                <span>{{ suggestion }}</span>
                <svg class="w-3.5 h-3.5 text-slate-500 group-hover:text-amber-400 transition-transform group-hover:translate-x-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <!-- Loading Indicator -->
        <div *ngIf="loading" class="flex justify-start">
          <div class="bg-slate-800 text-slate-200 rounded-2xl rounded-tl-xs border border-slate-700/80 p-4 flex gap-2 items-center">
            <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce"></span>
            <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
            <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
          </div>
        </div>

      </div>
    </div>

    <!-- Bottom Capsule Input Bar (Anchored at true bottom of screen) -->
    <div class="p-3 sm:p-4 pb-3 sm:pb-4 px-4 sm:px-8 md:px-12 bg-slate-900 border-t border-slate-800/80 shrink-0">
      <div class="w-full max-w-none px-2 sm:px-6 md:px-12 mx-auto transition-all duration-300">
        <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-2 pl-3 sm:pl-4 flex items-center gap-2 shadow-2xl focus-within:border-amber-500/60 focus-within:ring-2 focus-within:ring-amber-500/20 transition-all">
          
          <!-- Attachment / Plus Icon -->
          <button type="button" class="text-slate-400 hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-700/50 transition-colors shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>

          <!-- Input Textfield -->
          <input type="text" [(ngModel)]="question" (keyup.enter)="sendMessage()" [disabled]="loading"
                 placeholder="Ask anything about Tamil literature..."
                 class="flex-1 w-full min-w-0 bg-transparent text-sm sm:text-base text-white focus:outline-none placeholder-slate-400 px-1 py-1.5">

          <!-- Send Button -->
          <button (click)="sendMessage()" [disabled]="loading || !question.trim()"
                  class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-bold px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl transition-all flex items-center gap-1.5 shadow-[0_0_15px_rgba(245,158,11,0.2)] shrink-0">
            <span class="hidden sm:inline text-xs font-bold uppercase tracking-wider">Send</span>
            <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
          </button>
        </div>

        <p class="text-[11px] text-center text-slate-400 mt-2 font-medium">
          Sangam AI can make mistakes. Check important info.
        </p>
      </div>
    </div>

  </main>
</div>
