<div [ngClass]="{'h-full w-full border-0 rounded-none bg-transparent': isEmbedded, 'max-w-6xl mx-auto h-[calc(100vh-8rem)] mt-6 bg-slate-800/40 border border-slate-700/50 rounded-3xl shadow-xl backdrop-blur-sm': !isEmbedded}" class="flex flex-col overflow-hidden">
  
  <div class="bg-slate-900/50 px-6 py-4 border-b border-slate-700/50 flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        அறிக புறநானூறு - An interactive conversational AI
      </h2>
      <p class="text-xs text-slate-400 mt-1">RAG-powered conversational engine</p>
    </div>
    <button (click)="newChat()" class="text-xs font-semibold px-4 py-2 bg-slate-700/50 hover:bg-slate-600 rounded-lg text-slate-200 transition-colors flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      New Chat
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar" #chatContainer>
    <div *ngFor="let msg of messages; let last = last" class="flex flex-col" [ngClass]="{'items-end': msg.role === 'user', 'items-start': msg.role === 'assistant'}">
      
      <div class="max-w-[80%]" [ngClass]="{'bg-gradient-to-br from-amber-500 to-orange-500 text-slate-900 rounded-2xl rounded-tr-sm': msg.role === 'user', 'bg-slate-700/60 text-slate-200 rounded-2xl rounded-tl-sm border border-slate-600': msg.role === 'assistant'}">
        <div class="p-4 whitespace-pre-line leading-relaxed font-medium">
          {{msg.content}}
        </div>
        
        <div *ngIf="msg.is_verified_static" class="px-4 pb-3 pt-1">
          <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase tracking-wider border border-emerald-500/30">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Verified Answer
          </span>
        </div>

        <div *ngIf="msg.sources && msg.sources.length > 0" class="px-4 pb-4 pt-2 border-t border-slate-600/50 mt-2">
          <p class="text-xs text-amber-400 font-bold mb-2 uppercase tracking-wider">Retrieved Context</p>
          <div class="space-y-2">
            <div *ngFor="let source of msg.sources" class="bg-slate-800/80 rounded p-2 text-xs text-slate-400 line-clamp-2" [title]="source">
              {{source}}
            </div>
          </div>
        </div>
      </div>

      <!-- Suggested Questions (Now visible on all messages, not just the last one) -->
      <div *ngIf="msg.role === 'assistant' && msg.suggested_questions && msg.suggested_questions.length > 0" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl">
        <button *ngFor="let suggestion of msg.suggested_questions; let i = index" 
                (click)="sendQuestion(suggestion, msg.suggested_question_ids ? msg.suggested_question_ids[i] : undefined)" 
                [disabled]="loading"
                class="bg-slate-800/50 hover:bg-slate-700/80 border border-slate-700 hover:border-amber-500/50 p-4 rounded-xl text-left transition-all group disabled:opacity-50 disabled:cursor-not-allowed">
          <p class="text-sm font-medium text-slate-300 group-hover:text-amber-400">{{suggestion}}</p>
        </button>
      </div>

    </div>
    
    <!-- Old Starter Prompts Grid removed because starters are now suggestions on the greeting -->

    <div *ngIf="loading" class="flex justify-start">
      <div class="bg-slate-700/60 text-slate-200 rounded-2xl rounded-tl-sm border border-slate-600 p-4 flex gap-2 items-center">
        <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce"></span>
        <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
        <span class="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
      </div>
    </div>
  </div>

  <div class="p-4 bg-slate-900/50 border-t border-slate-700/50">
    <div class="flex gap-4">
      <input type="text" [(ngModel)]="question" (keyup.enter)="sendMessage()" [disabled]="loading"
        placeholder="Ask a question about Tamil literature..."
        class="flex-1 bg-slate-800/80 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner">
      <button (click)="sendMessage()" [disabled]="loading || !question.trim()"
        class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 disabled:opacity-50 disabled:cursor-not-allowed text-slate-900 font-bold px-6 py-3 rounded-xl transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
        <span>Send</span>
        <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </div>
  </div>
</div>
