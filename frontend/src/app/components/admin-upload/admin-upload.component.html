<div class="max-w-3xl mx-auto mt-6">
  <div class="bg-slate-800/40 border border-slate-700/50 rounded-3xl p-8 sm:p-12 backdrop-blur-sm shadow-xl relative overflow-hidden">
    
    <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex items-center gap-4 mb-8 relative z-10">
      <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl flex items-center justify-center border border-indigo-500/30">
        <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      </div>
      <div>
        <h2 class="text-3xl font-bold text-white">Admin Dataset Upload</h2>
        <p class="text-slate-400 mt-1">Upload JSON files to automatically index into the database.</p>
      </div>
    </div>

    <div class="flex gap-4 mb-6 relative z-10 justify-center">
      <button (click)="setMode('poem')" [ngClass]="uploadMode === 'poem' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-6 py-2 rounded-lg font-medium transition-colors">
        Poem Dataset
      </button>
      <button (click)="setMode('qa')" [ngClass]="uploadMode === 'qa' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-6 py-2 rounded-lg font-medium transition-colors">
        QA Pairs Dataset
      </button>
    </div>

    <div class="space-y-6 relative z-10">
      <div class="border-2 border-dashed border-slate-600 rounded-2xl p-10 text-center hover:border-amber-500/50 transition-colors bg-slate-900/30">
        <svg class="mx-auto h-12 w-12 text-slate-500 mb-4" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="flex text-sm text-slate-400 justify-center">
          <label for="file-upload" class="relative cursor-pointer bg-slate-800 rounded-md font-medium text-amber-500 hover:text-amber-400 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-amber-500 px-4 py-2 border border-slate-700 hover:border-amber-500/30 transition-colors">
            <span>Select a JSON file</span>
            <input id="file-upload" name="file-upload" type="file" accept=".json" class="sr-only" (change)="onFileSelected($event)">
          </label>
        </div>
        <p class="text-xs text-slate-500 mt-3">Only Sangam Schema JSON files supported</p>
        
        <div *ngIf="selectedFile" class="mt-6 flex justify-center">
          <p class="text-emerald-400 font-medium bg-emerald-500/10 inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-emerald-500/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Selected: {{selectedFile.name}}
          </p>
        </div>
      </div>

      <button (click)="uploadData()" [disabled]="!selectedFile || loading"
        class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 disabled:opacity-50 disabled:cursor-not-allowed text-slate-900 font-bold px-8 py-4 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2">
        <span *ngIf="!loading">Upload and Index Dataset</span>
        <div *ngIf="loading" class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5 text-slate-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          Indexing...
        </div>
      </button>

      <div *ngIf="message" [ngClass]="{'bg-emerald-500/10 text-emerald-400 border-emerald-500/30': !isError, 'bg-red-500/10 text-red-400 border-red-500/30': isError}" class="p-4 rounded-xl border flex items-center gap-3 font-medium">
        <svg *ngIf="!isError" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <svg *ngIf="isError" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {{message}}
      </div>
    </div>
  </div>
</div>
